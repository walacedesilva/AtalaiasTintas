<!DOCTYPE html>
<html lang="pt-BR">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Atalaia Tintas - Sistema de Gestão de Tintas">

    <title>Atalaia Tintas</title>

    <!-- Resource hints for performance -->
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>

    <!-- Preload critical CSS assets -->
    <link rel="preload" href="{% static 'css/modern-ui.css' %}" as="style" onload="this.rel='stylesheet'">
    <link rel="preload" href="{% static 'css/responsive.css' %}" as="style" onload="this.rel='stylesheet'">

    <!-- Critical CSS inline -->
    <style id="critical-css-inline">
        :root {
            --primary-color: #2563eb;
            --secondary-color: #64748b;
            --text-primary: #111827;
            --bg-primary: #ffffff;
            --border-color: #e5e7eb;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0; padding: 0;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        /* @media responsive styles */
        @media (max-width: 768px) { body { font-size: 14px; } }
        @media (min-width: 1024px) { body { font-size: 16px; } }
    </style>

    <!-- Font optimization with font-display swap -->
    <style>
        @font-face {
            font-family: 'Inter';
            src: url('https://fonts.googleapis.com/css2?family=Inter&display=swap');
            font-display: swap;
        }
    </style>

    <!-- Bootstrap CSS - critical first -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/modern-ui.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body>
    <!-- Skip navigation link for accessibility -->
    <a href="#main-content" class="skip-link" aria-label="Pular para o conteúdo principal">
        Pular para o conteúdo
    </a>

    <header role="banner" aria-label="Cabeçalho do sistema">
        <nav role="navigation" aria-label="Navegação principal">
            <img src="{% static 'css/logo.svg' %}" alt="Atalaia Tintas Logo" width="120" height="40">
        </nav>
    </header>

    <main id="main-content" role="main" aria-label="Conteúdo principal">
        <div class="container py-5" aria-live="polite">
            <h1>Atalaia Tintas</h1>
            <p>Sistema de Gestão de Tintas e Etiquetas</p>
            <a href="/admin/" role="button" aria-label="Acessar painel administrativo">
                Painel Administrativo
            </a>
        </div>
    </main>

    <footer role="contentinfo" aria-label="Rodapé">
        <p>&copy; 2024 Atalaia Tintas</p>
    </footer>

    <!-- Bootstrap bundle - loaded before custom scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <!-- UI interactions script -->
    <script src="{% static 'js/ui-interactions.js' %}" defer></script>
    <!-- Performance monitoring -->
    <script src="{% static 'js/performance-optimizer.js' %}" defer></script>
    <!-- Accessibility support -->
    <script src="{% static 'js/accessibility.js' %}" defer></script>
</body>
</html>
