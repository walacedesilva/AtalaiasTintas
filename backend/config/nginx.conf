# Nginx Configuration Template for Atalaia Tintas Paint Store System
# Blue-Green Deployment Configuration with Load Balancing
# 
# This configuration supports:
# - Blue-green deployment switching
# - SSL termination
# - Static file serving
# - WebSocket support for real-time features
# - Health checks and failover
# - Security headers and protection

# Upstream servers for blue-green deployment
upstream tintas_blue {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=30s backup;
    keepalive 32;
}

upstream tintas_green {
    server 127.0.0.1:8002 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8003 max_fails=3 fail_timeout=30s backup;
    keepalive 32;
}

# Active deployment - switch between blue/green during deployment
# Default to blue environment
upstream tintas_active {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=30s backup;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;

# Cache zones
proxy_cache_path /var/cache/nginx/tintas levels=1:2 keys_zone=tintas_cache:10m max_size=100m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name {{ DOMAIN_NAME }} www.{{ DOMAIN_NAME }};
    
    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name {{ DOMAIN_NAME }} www.{{ DOMAIN_NAME }};
    
    # SSL Configuration
    ssl_certificate {{ SSL_CERT_PATH }};
    ssl_certificate_key {{ SSL_KEY_PATH }};
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;
    
    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; child-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    
    # Gzip compression
    gzip on;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # Client settings
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 30s;
    
    # Root directory for static files
    root {{ PROJECT_ROOT }}/static;
    
    # Static files - served directly by Nginx
    location /static/ {
        alias {{ PROJECT_ROOT }}/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        
        # Gzip static files
        gzip_static on;
        
        # Security for static files
        location ~* \.(js|css)$ {
            add_header Cache-Control "public, max-age=31536000";
        }
        
        location ~* \.(jpg|jpeg|png|gif|ico|svg)$ {
            add_header Cache-Control "public, max-age=31536000";
        }
    }
    
    # Media files - user uploads
    location /media/ {
        alias {{ PROJECT_ROOT }}/media/;
        expires 1M;
        add_header Cache-Control "public";
        
        # Security for media files
        location ~* \.(php|py|pl|sh|cgi|asp|aspx)$ {
            deny all;
        }
    }
    
    # Health check endpoints - bypass rate limiting
    location = /health/ {
        access_log off;
        proxy_pass http://tintas_active;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }
    
    # Deployment status endpoint for blue-green coordination
    location = /deployment/status/ {
        access_log off;
        proxy_pass http://tintas_active;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Authentication endpoints - strict rate limiting
    location /api/auth/ {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        
        proxy_pass http://tintas_active;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
        
        # Security headers for API
        add_header X-API-Version "1.0";
    }
    
    # API endpoints - moderate rate limiting
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;
        
        # Enable caching for GET requests
        proxy_cache tintas_cache;
        proxy_cache_methods GET;
        proxy_cache_valid 200 1m;
        proxy_cache_valid 404 10s;
        proxy_cache_bypass $http_pragma $http_authorization;
        proxy_no_cache $http_pragma $http_authorization;
        
        proxy_pass http://tintas_active;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    
    # WebSocket support for real-time features
    location /ws/ {
        proxy_pass http://tintas_active;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeout settings
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    
    # Admin interface - restricted access
    location /admin/ {
        # Allow only specific IPs for admin access
        # allow {{ ADMIN_IP_RANGE }};
        # deny all;
        
        limit_req zone=general burst=20 nodelay;
        
        proxy_pass http://tintas_active;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }
    
    # Frontend application - React SPA
    location / {
        limit_req zone=general burst=100 nodelay;
        
        try_files $uri $uri/ @backend;
        
        # Cache static assets
        expires 1h;
        add_header Cache-Control "public";
    }
    
    # Fallback to backend for SPA routing
    location @backend {
        proxy_pass http://tintas_active;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }
    
    # Security: Block common attack patterns
    location ~* \.(env|git|svn|htaccess|htpasswd)$ {
        deny all;
        return 404;
    }
    
    location ~* \.(sql|bak|backup|dump)$ {
        deny all;
        return 404;
    }
    
    # Block bot patterns
    if ($http_user_agent ~* (bot|crawler|spider|scraper)) {
        return 403;
    }
    
    # Access and error logs
    access_log /var/log/nginx/tintas_access.log;
    error_log /var/log/nginx/tintas_error.log;
}

# Blue environment specific configuration (for deployment switching)
server {
    listen 8080;
    server_name {{ DOMAIN_NAME }};
    
    location / {
        proxy_pass http://tintas_blue;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    access_log /var/log/nginx/tintas_blue_access.log;
    error_log /var/log/nginx/tintas_blue_error.log;
}

# Green environment specific configuration (for deployment switching)
server {
    listen 8081;
    server_name {{ DOMAIN_NAME }};
    
    location / {
        proxy_pass http://tintas_green;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    access_log /var/log/nginx/tintas_green_access.log;
    error_log /var/log/nginx/tintas_green_error.log;
}

# Nginx status page for monitoring
server {
    listen 127.0.0.1:8888;
    
    location = /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}