# Supervisor Configuration for Atalaia Tintas Paint Store System
# Process Management for Blue-Green Deployment
#
# This configuration manages:
# - Blue and Green application environments
# - Celery workers and beat scheduler
# - Background task processing
# - Automatic restart and failure recovery
# - Log management and monitoring

[supervisord]
nodaemon=false
pidfile=/var/run/supervisord.pid
logfile=/var/log/supervisor/supervisord.log
childlogdir=/var/log/supervisor
user=root
directory=/tmp

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700
username=tintas
password=tintas_supervisor_pass

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
username=tintas
password=tintas_supervisor_pass

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ================================
# Blue Environment Programs
# ================================

[program:tintas_blue_web]
command=%(ENV_PROJECT_ROOT)s/venv/bin/gunicorn 
        --config %(ENV_PROJECT_ROOT)s/backend/config/gunicorn.conf.py
        tintas_system.wsgi:application
directory=%(ENV_PROJECT_ROOT)s/backend
environment=
    DJANGO_SETTINGS_MODULE="tintas_system.settings.production",
    DEPLOYMENT_ENV="blue",
    PATH="%(ENV_PROJECT_ROOT)s/venv/bin:%(ENV_PATH)s"
user=tintas
group=tintas
autostart=true
autorestart=true
startretries=3
startsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/tintas_blue_web.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/supervisor/tintas_blue_web_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

[program:tintas_blue_celery_worker]
command=%(ENV_PROJECT_ROOT)s/venv/bin/celery 
        --app=tintas_system.celery:app worker
        --loglevel=info
        --hostname=blue_worker%%i
        --queues=default,high_priority,paint_calculations,notifications
        --concurrency=4
        --max-tasks-per-child=1000
directory=%(ENV_PROJECT_ROOT)s/backend
environment=
    DJANGO_SETTINGS_MODULE="tintas_system.settings.production",
    DEPLOYMENT_ENV="blue",
    PATH="%(ENV_PROJECT_ROOT)s/venv/bin:%(ENV_PATH)s"
user=tintas
group=tintas
numprocs=1
autostart=true
autorestart=true
startretries=3
startsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/tintas_blue_celery_worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/supervisor/tintas_blue_celery_worker_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

[program:tintas_blue_celery_beat]
command=%(ENV_PROJECT_ROOT)s/venv/bin/celery 
        --app=tintas_system.celery:app beat
        --loglevel=info
        --scheduler=django_celery_beat.schedulers:DatabaseScheduler
        --pidfile=/var/run/celery/tintas_blue_beat.pid
directory=%(ENV_PROJECT_ROOT)s/backend
environment=
    DJANGO_SETTINGS_MODULE="tintas_system.settings.production",
    DEPLOYMENT_ENV="blue",
    PATH="%(ENV_PROJECT_ROOT)s/venv/bin:%(ENV_PATH)s"
user=tintas
group=tintas
numprocs=1
autostart=true
autorestart=true
startretries=3
startsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/tintas_blue_celery_beat.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/supervisor/tintas_blue_celery_beat_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

