# ================================
# Shared Services (Always Running)
# ================================

[program:tintas_redis]
command=redis-server %(ENV_PROJECT_ROOT)s/backend/config/redis.conf
directory=/tmp
user=redis
group=redis
autostart=true
autorestart=true
startretries=3
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/tintas_redis.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10

[program:tintas_monitoring]
command=%(ENV_PROJECT_ROOT)s/venv/bin/python manage.py health_check --daemon
directory=%(ENV_PROJECT_ROOT)s/backend
environment=
    DJANGO_SETTINGS_MODULE="tintas_system.settings.production",
    PATH="%(ENV_PROJECT_ROOT)s/venv/bin:%(ENV_PATH)s"
user=tintas
group=tintas
autostart=true
autorestart=true
startretries=999
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/tintas_monitoring.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10

# ================================
# Process Groups for Blue-Green Management
# ================================

[group:tintas_blue]
programs=tintas_blue_web,tintas_blue_celery_worker,tintas_blue_celery_beat
priority=999

[group:tintas_green]  
programs=tintas_green_web,tintas_green_celery_worker,tintas_green_celery_beat
priority=998

[group:tintas_shared]
programs=tintas_redis,tintas_monitoring
priority=1000

# ================================
# Event Listeners for Deployment Coordination
# ================================

[eventlistener:deployment_coordinator]
command=%(ENV_PROJECT_ROOT)s/venv/bin/python %(ENV_PROJECT_ROOT)s/backend/scripts/deployment_coordinator.py
directory=%(ENV_PROJECT_ROOT)s/backend
environment=
    DJANGO_SETTINGS_MODULE="tintas_system.settings.production",
    PATH="%(ENV_PROJECT_ROOT)s/venv/bin:%(ENV_PATH)s"
events=PROCESS_STATE_RUNNING,PROCESS_STATE_STOPPED,PROCESS_STATE_FATAL
buffer_size=100
autostart=true
autorestart=true
user=tintas
group=tintas
stdout_logfile=/var/log/supervisor/deployment_coordinator.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10

[eventlistener:failure_alert]
command=%(ENV_PROJECT_ROOT)s/venv/bin/python %(ENV_PROJECT_ROOT)s/backend/scripts/failure_alert.py
directory=%(ENV_PROJECT_ROOT)s/backend
environment=
    DJANGO_SETTINGS_MODULE="tintas_system.settings.production",
    PATH="%(ENV_PROJECT_ROOT)s/venv/bin:%(ENV_PATH)s"
events=PROCESS_STATE_FATAL,PROCESS_STATE_BACKOFF
buffer_size=100
autostart=true
autorestart=true
user=tintas
group=tintas
stdout_logfile=/var/log/supervisor/failure_alert.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10

# ================================
# Include Additional Configurations
# ================================

[include]
files = /etc/supervisor/conf.d/tintas_custom_*.conf

# ================================
# Configuration Templates for Different Environments
# ================================

# Usage Instructions:
# 
# 1. Start Blue Environment (Default):
#    supervisorctl start tintas_blue:*
#
# 2. Deploy to Green Environment:
#    supervisorctl start tintas_green:*
#    # Wait for health checks to pass
#    # Switch Nginx upstream to green
#    supervisorctl stop tintas_blue:*
#
# 3. Rollback to Blue:
#    supervisorctl start tintas_blue:*  
#    # Switch Nginx upstream to blue
#    supervisorctl stop tintas_green:*
#
# 4. Monitor processes:
#    supervisorctl status
#    supervisorctl tail -f tintas_blue_web stdout
#
# 5. Restart specific service:
#    supervisorctl restart tintas_blue_celery_worker
#
# 6. Emergency stop all:
#    supervisorctl stop all

# ================================
# Paint Store Business Specific Configuration
# ================================

# Additional worker for intensive paint calculations during peak hours
[program:tintas_paint_calculator_worker]
command=%(ENV_PROJECT_ROOT)s/venv/bin/celery 
        --app=tintas_system.celery:app worker
        --loglevel=info
        --hostname=paint_calc_worker%%i
        --queues=paint_calculations
        --concurrency=2
        --max-tasks-per-child=500
directory=%(ENV_PROJECT_ROOT)s/backend
environment=
    DJANGO_SETTINGS_MODULE="tintas_system.settings.production",
    PATH="%(ENV_PROJECT_ROOT)s/venv/bin:%(ENV_PATH)s"
user=tintas
group=tintas
numprocs=1
autostart=false  # Started manually during peak hours
autorestart=true
startretries=3
startsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/tintas_paint_calc_worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10

# Backup service for critical paint store data
[program:tintas_backup_service]
command=%(ENV_PROJECT_ROOT)s/backend/scripts/backup.sh --daemon
directory=%(ENV_PROJECT_ROOT)s/backend
user=tintas
group=tintas
autostart=true
autorestart=true
startretries=999
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/tintas_backup.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10